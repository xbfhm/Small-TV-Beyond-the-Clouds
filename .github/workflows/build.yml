name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build
        run: |
          cd app
          chmod +x gradlew 2>/dev/null || true
          # 无 gradle wrapper 时直接下载 gradle
          if [ ! -f gradlew ]; then
            curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.5/bin/gradle assembleDebug 2>&1 | tee build.log
          else
            ./gradlew assembleDebug 2>&1 | tee build.log
          fi

      - name: Upload build log on failure
        if: failure()
        run: |
          cd app
          tail -c 80000 build.log > ci-log.txt
          git add ci-log.txt 2>/dev/null || true
          git commit -m "ci log" 2>/dev/null || true
          git push origin HEAD:ci-log --force 2>/dev/null || true

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 云之彼端小电视 最新构建
          files: app/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
